name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Typecheck before publishing: a red build should never reach the URL.
      - run: npx tsc --noEmit

      # Online accounts. The publishable key is designed to be public: what each
      # person can read or write is decided by the security rules in Supabase.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://yrdirrudlptmvkhbdeqt.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_s5pYeMNcWlKoQoFV2M1gdg_GxlnAB-9

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
